name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: true
      matrix:
        include:
          - os: windows-latest
            args: ''
          - os: macos-latest
            args: '--target universal-apple-darwin'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
      - uses: dtolnay/rust-toolchain@686976e191b89faba57d3206551f0f330d8cb249 # stable
        with:
          toolchain: stable
          targets: ${{ matrix.os == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          save-if: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/wisp/package-lock.json
      - name: Install frontend dependencies
        working-directory: apps/wisp
        run: npm ci
      - name: Check the tag matches the app version
        working-directory: apps/wisp
        shell: bash
        run: |
          npm run check-versions
          test "v$(node -p "require('./package.json').version")" = "${GITHUB_REF_NAME}"
      - uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0.6.2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: apps/wisp
          tagName: ${{ github.ref_name }}
          releaseName: Wisp ${{ github.ref_name }}
          releaseBody: "See the README for install notes. macOS builds are not notarized: on first launch open System Settings > Privacy & Security and choose Open Anyway."
          releaseDraft: true
          prerelease: false
          args: ${{ matrix.args }}
